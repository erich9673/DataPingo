      <path d="M1120,365.0 H1278 A16,16 0 0 1 1294,381.0 V437.0 A16,16 0 0 1 1278,453.0 H1154 L1126,473.0 L1132,453.0 H1120 A16,16 0 0 1 1104,437.0 V381.0 A16,16 0 0 1 1120,365.0 Z" fill="#1F170B" stroke="#F0A93C" stroke-opacity="0.95" stroke-width="2.25" stroke-linejoin="round"/>
      <rect x="1125" y="400.0" width="26" height="19" rx="3.5" fill="none" stroke="#F0A93C" stroke-width="2.6"/><path d="M1127,403.0 L1138,411.0 L1149,403.0" fill="none" stroke="#F0A93C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="1166" y="395.0" width="77" height="9" rx="4.5" fill="#FBE3B8" opacity="0.9"/>
      <rect x="1166" y="415.0" width="94" height="8" rx="4" fill="#F0A93C" opacity="0.6"/>
  </g>
  <g>
      <g transform="translate(0,8)">
      <path d="M1056,491.0 H1214 A16,16 0 0 1 1230,507.0 V563.0 A16,16 0 0 1 1214,579.0 H1090 L1062,599.0 L1068,579.0 H1056 A16,16 0 0 1 1040,563.0 V507.0 A16,16 0 0 1 1056,491.0 Z" fill="#1F170B" stroke="#F0A93C" stroke-opacity="0.95" stroke-width="2.25" stroke-linejoin="round"/>
      <rect x="1061" y="526.0" width="26" height="19" rx="3.5" fill="none" stroke="#F0A93C" stroke-width="2.6"/><path d="M1063,529.0 L1074,537.0 L1085,529.0" fill="none" stroke="#F0A93C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="1102" y="521.0" width="73" height="9" rx="4.5" fill="#FBE3B8" opacity="0.9"/>
      <rect x="1102" y="541.0" width="52" height="8" rx="4" fill="#F0A93C" opacity="0.6"/>
      </g>
  </g>
  <g>
      <path d="M1056,631.0 H1214 A16,16 0 0 1 1230,647.0 V703.0 A16,16 0 0 1 1214,719.0 H1090 L1062,739.0 L1068,719.0 H1056 A16,16 0 0 1 1040,703.0 V647.0 A16,16 0 0 1 1056,631.0 Z" fill="#0A1628" stroke="#705AD0" stroke-opacity="0.85" stroke-width="2" stroke-linejoin="round"/>
      <rect x="1066" y="661.0" width="84" height="9" rx="4.5" fill="#E8F4FF" opacity="0.9"/>
      <rect x="1066" y="681.0" width="115" height="8" rx="4" fill="#6B86A4" opacity="0.75"/>
