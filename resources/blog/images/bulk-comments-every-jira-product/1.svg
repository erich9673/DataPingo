  <circle cx="1040" cy="225" r="3.5" fill="#17BBEB"/>
  <circle cx="1040" cy="375" r="3.5" fill="#359AE2"/>
  <circle cx="1040" cy="525" r="3.5" fill="#F0A93C"/>
  <circle cx="1040" cy="675" r="3.5" fill="#705AD0"/>
