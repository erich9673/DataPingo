<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Blog thumbnail: "Bulk Comments for Jira now works across every Jira product".
       Left: the four Jira products (Jira, Jira Service Management, Customer Service
       Management, Jira Product Discovery). Centre: the one Bulk Comments page. Right:
       what each item leaves with. Every strand keeps its own colour through the page,
       so each item gets its own comment; nothing fans out from a source issue.
       Amber marks a reply that reaches a customer, as it does in the app, and is the
       only warm colour in the blog thumbnail family. The service request carries two
       comments (internal note behind, customer reply in front); the Customer Service
       Management request carries a reply only. -->
  <defs>
    <radialGradient id="bcjWash" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#05CEF0" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#05CEF0" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#05CEF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bcjToCustomer" gradientUnits="userSpaceOnUse" x1="900" y1="0" x2="1040" y2="0">
      <stop offset="0%" stop-color="#527AD9"/>
      <stop offset="100%" stop-color="#F0A93C"/>
    </linearGradient>
    <filter id="bcjGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#020911"/>
  <rect width="1600" height="900" fill="url(#bcjWash)"/>

  <!-- glows: cool behind the page, warm only where a customer is reached -->
  <rect x="700" y="290" width="200" height="320" rx="20" fill="#05CEF0" opacity="0.15" filter="url(#bcjGlow)"/>
  <ellipse cx="1170" cy="470" rx="150" ry="105" fill="#F0A93C" opacity="0.06" filter="url(#bcjGlow)"/>

  <!-- strands: product -> page -> that item's own comment -->
  <g fill="none" stroke-width="2.5" stroke-opacity="0.5">
    <path d="M372,225 C540,225 540,382 700,382" stroke="#17BBEB"/>
    <path d="M900,382 C975,382 965,225 1040,225" stroke="#17BBEB"/>
    <path d="M372,375 C540,375 540,442 700,442" stroke="#359AE2"/>
    <path d="M900,442 C975,442 965,375 1040,375" stroke="#359AE2"/>
    <path d="M372,525 C540,525 540,502 700,502" stroke="#527AD9"/>
    <path d="M900,502 C975,502 965,525 1040,525" stroke="url(#bcjToCustomer)"/>
    <path d="M372,675 C540,675 540,562 700,562" stroke="#705AD0"/>
    <path d="M900,562 C975,562 965,675 1040,675" stroke="#705AD0"/>
  </g>
  <!-- the four products -->
  <g>
    <circle cx="330" cy="225" r="42" fill="#0A1628" stroke="#17BBEB" stroke-opacity="0.9" stroke-width="2.5"/>
    <rect x="314" y="209" width="32" height="32" rx="8" fill="none" stroke="#17BBEB" stroke-width="3"/><path d="M321.5,225.5 L327.5,231.5 L339,218.5" fill="none" stroke="#17BBEB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="330" cy="375" r="42" fill="#0A1628" stroke="#359AE2" stroke-opacity="0.9" stroke-width="2.5"/>
    <polygon points="333,356 318,378 329,378 326,394 342,371 331,371" fill="#359AE2" stroke="#359AE2" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="330" cy="525" r="42" fill="#0A1628" stroke="#527AD9" stroke-opacity="0.9" stroke-width="2.5"/>
    <circle cx="330" cy="517" r="8" fill="none" stroke="#527AD9" stroke-width="3"/><path d="M315,542 C315,528 345,528 345,542" fill="none" stroke="#527AD9" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="330" cy="675" r="42" fill="#0A1628" stroke="#705AD0" stroke-opacity="0.9" stroke-width="2.5"/>
    <circle cx="330" cy="670" r="12" fill="none" stroke="#705AD0" stroke-width="3"/><path d="M324.5,684.5 L324.5,689 L335.5,689 L335.5,684.5" fill="none" stroke="#705AD0" stroke-width="3" stroke-linejoin="round"/><line x1="325.5" y1="694.5" x2="334.5" y2="694.5" stroke="#705AD0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- the one page -->
  <g>
    <rect x="700" y="290" width="200" height="320" rx="20" fill="#060E1C" stroke="#05CEF0" stroke-opacity="0.9" stroke-width="2.25"/>
    <rect x="728" y="324" width="104" height="10" rx="5" fill="#E8F4FF"/>
    <circle cx="734" cy="382" r="6.5" fill="#17BBEB"/>
    <rect x="752" y="378" width="112" height="8" rx="4" fill="#6B86A4" opacity="0.8"/>
    <circle cx="700" cy="382" r="3.5" fill="#17BBEB"/><circle cx="900" cy="382" r="3.5" fill="#17BBEB"/>
    <circle cx="734" cy="442" r="6.5" fill="#359AE2"/>
    <rect x="752" y="438" width="92" height="8" rx="4" fill="#6B86A4" opacity="0.8"/>
    <circle cx="700" cy="442" r="3.5" fill="#359AE2"/><circle cx="900" cy="442" r="3.5" fill="#359AE2"/>
    <circle cx="734" cy="502" r="6.5" fill="#527AD9"/>
    <rect x="752" y="498" width="120" height="8" rx="4" fill="#6B86A4" opacity="0.8"/>
    <circle cx="700" cy="502" r="3.5" fill="#527AD9"/><circle cx="900" cy="502" r="3.5" fill="#527AD9"/>
    <circle cx="734" cy="562" r="6.5" fill="#705AD0"/>
    <rect x="752" y="558" width="100" height="8" rx="4" fill="#6B86A4" opacity="0.8"/>
    <circle cx="700" cy="562" r="3.5" fill="#705AD0"/><circle cx="900" cy="562" r="3.5" fill="#705AD0"/>
  </g>
  <!-- what each item leaves with -->
  <g>
