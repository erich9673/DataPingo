      <rect x="1066" y="211.0" width="101" height="9" rx="4.5" fill="#E8F4FF" opacity="0.9"/>
      <rect x="1066" y="231.0" width="70" height="8" rx="4" fill="#6B86A4" opacity="0.75"/>
