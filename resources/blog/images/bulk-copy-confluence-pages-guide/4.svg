<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wash" cx="30%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#05CEF0" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#05CEF0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#05CEF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
